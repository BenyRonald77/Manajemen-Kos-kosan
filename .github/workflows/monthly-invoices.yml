name: Generate Monthly Invoices

# Contoh scheduler eksternal untuk memicu tagihan bulanan otomatis tanpa perlu
# proses server yang selalu menyala — aman karena endpoint-nya idempotent
# (hanya membuat tagihan saat periode bulan berjalan belum punya tagihan).
# Sesuaikan APP_URL & CRON_SECRET di repo Settings > Secrets and variables >
# Actions, lalu aktifkan lagi jadwalnya (uncomment blok `schedule:` di
# bawah, cron "5 17 * * *" = jam 00:05 WIB) sebelum mengandalkan workflow
# ini berjalan otomatis.
on:
  # schedule:
  #   - cron: "5 17 * * *"
  workflow_dispatch: {}

jobs:
  trigger-invoice-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil endpoint cron generate-invoices
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/generate-invoices" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
